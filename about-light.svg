  @keyframes grow { from { transform: scaleX(0); } }
  @keyframes pop { from { opacity: 0; transform: scale(0.6); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  .scroll { animation: scroll 8.6s ease-in-out infinite; }
  @keyframes scroll { 0.00%, 40.70% { transform: translateY(-0px); } 50.00%, 90.70% { transform: translateY(-22px); } 100% { transform: translateY(0); } }
